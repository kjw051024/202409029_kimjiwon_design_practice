<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="시각디자이너 김지원의 브랜딩, UX/UI, 편집, 전시 디자인 프로젝트 모음"
    />
    <title>김지원 | Selected Projects</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero" aria-labelledby="page-title">
        <p class="eyebrow">KIM JIWON · DESIGN PORTFOLIO</p>
        <div class="hero-copy">
          <h1 id="page-title">Selected<br />Projects<span>.</span></h1>
          <p>
            다양한 분야를 경험하며<br />
            편식하지 않는 디자인을 지향합니다.
          </p>
        </div>
      </header>

      <section class="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <div>
            <p class="section-number">01 — 04</p>
            <h2 id="projects-title">프로젝트</h2>
          </div>

          <div class="filters" role="group" aria-label="프로젝트 카테고리 필터">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter-button" type="button" data-filter="branding" aria-pressed="false">브랜딩</button>
            <button class="filter-button" type="button" data-filter="uxui" aria-pressed="false">UX/UI</button>
            <button class="filter-button" type="button" data-filter="editorial" aria-pressed="false">편집</button>
            <button class="filter-button" type="button" data-filter="exhibition" aria-pressed="false">전시</button>
          </div>
        </div>

        <div id="project-grid" class="project-grid" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="프로젝트 상세 보기 닫기">×</button>
      <div class="dialog-visual" id="dialog-visual" aria-hidden="true"></div>
      <div class="dialog-content">
        <p class="dialog-meta" id="dialog-meta"></p>
        <h2 id="dialog-title"></h2>
        <p class="dialog-description" id="dialog-description"></p>
        <dl class="dialog-info">
          <div>
            <dt>Role</dt>
            <dd id="dialog-role"></dd>
          </div>
          <div>
            <dt>Tools</dt>
            <dd id="dialog-tools"></dd>
          </div>
        </dl>
        <div class="dialog-tags" id="dialog-tags" aria-label="프로젝트 키워드"></div>
      </div>
    </dialog>
  </body>
</html>
